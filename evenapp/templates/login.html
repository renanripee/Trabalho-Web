{% load static %}

<head>
    <meta charset="UTF-8">
    <link
        href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Roboto&family=Roboto+Condensed&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    {% block extra_css %}
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
    {% endblock %}
</head>

{% block content %}
<div class="container-fluid p-0 m-0">
    <div class="row h-100">
        <div class="col-6 p-0">
            <img src="{% static 'img/login.png' %}"  class="w-100 h-100 object-fit-cover" alt="Imagem de Login">
        </div>
        <div class="login col-6">
            <div class="login-card">
                <h1 class="login-title">EVENAPP</h1>
                <h3 class="login-subtitle">onde seus eventos favoritos começam</h1>

                <div class="field email-field">
                    <p class="ms-1 my-0 mb-1">Email</p>
                    <input type="text" class="form-control" placeholder="Digite algo">
                </div>
                <div class="field mt-2">
                    <p class="ms-1 my-0 mb-1">Senha</p>
                    <input type="text" class="form-control" placeholder="Digite algo">
                </div>
                <button type="button" class="enter-button btn">Entrar</button>
                <div class="field mt-2 mb-5">
                    <a class="signin" href="">Cadastre-se</a>
                </div>
            </div>
        </div>
    </div>
</div>


{% endblock %}
