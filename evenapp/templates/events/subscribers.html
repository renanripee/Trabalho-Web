<!-- templates/eventos/index.html -->
{% extends "base.html" %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/subscribers.css' %}">
{% endblock %}

{% block content %}
<div class="content">
    <h1 class="title pt-5">Inscritos</h1>
    <div class="subscribers">
        {% for subscriber in subscribers %}
        {% include 'users/subscriber.html' %}
        {% empty %}
        <h3 style="font-family: 'Roboto';">Nenhum evento disponível.</h3>
        {% endfor %}
    </div>
</div>

{% endblock %}
