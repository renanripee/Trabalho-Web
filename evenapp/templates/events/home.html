<!-- templates/eventos/index.html -->
{% extends "base.html" %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/home.css' %}">
{% endblock %}

{% block content %}
<div class="home">
    <h1 class="title pt-5">Eventos</h1>
    <div class="events">
        {% for evento in eventos %}
            {% include 'events/event.html' %}
        {% empty %}
            <h3>Nenhum evento disponível.</h3>
        {% endfor %}
    </div>
</div>

{% endblock %}
